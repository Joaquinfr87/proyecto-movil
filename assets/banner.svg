<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1200" height="400" rx="16"/>
    </clipPath>
  </defs>
  
  <g clip-path="url(#bannerClip)">
    <!-- Background -->
    <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>
    
    <!-- Decorative grid pattern -->
    <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
      <line x1="0" y1="50" x2="1200" y2="50"/>
      <line x1="0" y1="100" x2="1200" y2="100"/>
      <line x1="0" y1="150" x2="1200" y2="150"/>
      <line x1="0" y1="200" x2="1200" y2="200"/>
      <line x1="0" y1="250" x2="1200" y2="250"/>
      <line x1="0" y1="300" x2="1200" y2="300"/>
      <line x1="0" y1="350" x2="1200" y2="350"/>
      <line x1="100" y1="0" x2="100" y2="400"/>
      <line x1="200" y1="0" x2="200" y2="400"/>
      <line x1="300" y1="0" x2="300" y2="400"/>
      <line x1="400" y1="0" x2="400" y2="400"/>
      <line x1="500" y1="0" x2="500" y2="400"/>
      <line x1="600" y1="0" x2="600" y2="400"/>
      <line x1="700" y1="0" x2="700" y2="400"/>
      <line x1="800" y1="0" x2="800" y2="400"/>
      <line x1="900" y1="0" x2="900" y2="400"/>
      <line x1="1000" y1="0" x2="1000" y2="400"/>
      <line x1="1100" y1="0" x2="1100" y2="400"/>
    </g>
    
    <!-- Decorative map pins (background) -->
    <g opacity="0.08">
      <!-- Pin 1 -->
      <path d="M150 120 C135 120 122 133 122 148 C122 158 128 167 136 174 L150 190 L164 174 C172 167 178 158 178 148 C178 133 165 120 150 120Z" fill="#2563EB"/>
      <!-- Pin 2 -->
      <path d="M1050 80 C1035 80 1022 93 1022 108 C1022 118 1028 127 1036 134 L1050 150 L1064 134 C1072 127 1078 118 1078 108 C1078 93 1065 80 1050 80Z" fill="#10B981"/>
      <!-- Pin 3 -->
      <path d="M900 300 C885 300 872 313 872 328 C872 338 878 347 886 354 L900 370 L914 354 C922 347 928 338 928 328 C928 313 915 300 900 300Z" fill="#2563EB"/>
      <!-- Pin 4 -->
      <path d="M250 320 C235 320 222 333 222 348 C222 358 228 367 236 374 L250 390 L264 374 C272 367 278 358 278 348 C278 333 265 320 250 320Z" fill="#10B981"/>
    </g>
    
    <!-- Accent line top -->
    <rect x="80" y="60" width="1040" height="3" fill="url(#accentGrad)" rx="1.5" opacity="0.6"/>
    
    <!-- Logo mark (left side) -->
    <g transform="translate(100, 140)">
      <!-- Pin -->
      <path d="M60 0 C35 0 14 21 14 46 C14 62 24 76 38 88 L60 116 L82 88 C96 76 106 62 106 46 C106 21 85 0 60 0Z" 
            fill="url(#blueGrad)" filter="url(#glow)"/>
      <!-- Inner circle -->
      <circle cx="60" cy="44" r="22" fill="url(#greenGrad)"/>
      <!-- Field lines -->
      <circle cx="60" cy="44" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
      <circle cx="60" cy="44" r="2" fill="#FFFFFF" opacity="0.9"/>
      <line x1="60" y1="22" x2="60" y2="66" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
      <rect x="42" y="26" width="36" height="36" rx="1" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    </g>
    
    <!-- Title text -->
    <text x="250" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      Lugares
    </text>
    <text x="530" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#10B981" letter-spacing="-1">
      Interactivos
    </text>
    
    <!-- Subtitle -->
    <text x="250" y="225" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94A3B8" font-weight="400" letter-spacing="3">
      VISUALIZACIÓN INTERACTIVA DE ESCENARIOS DEPORTIVOS
    </text>
    
    <!-- Feature badges -->
    <g transform="translate(250, 260)">
      <!-- Badge 1: Mapa -->
      <rect x="0" y="0" width="120" height="36" rx="18" fill="#2563EB" opacity="0.15"/>
      <rect x="0" y="0" width="120" height="36" rx="18" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
      <text x="60" y="23" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#93C5FD" text-anchor="middle" font-weight="500">📍 Mapa</text>
      
      <!-- Badge 2: Favoritos -->
      <rect x="135" y="0" width="130" height="36" rx="18" fill="#10B981" opacity="0.15"/>
      <rect x="135" y="0" width="130" height="36" rx="18" fill="none" stroke="#10B981" stroke-width="1" opacity="0.3"/>
      <text x="200" y="23" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#6EE7B7" text-anchor="middle" font-weight="500">⭐ Favoritos</text>
      
      <!-- Badge 3: Visor 360° -->
      <rect x="280" y="0" width="140" height="36" rx="18" fill="#2563EB" opacity="0.15"/>
      <rect x="280" y="0" width="140" height="36" rx="18" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
      <text x="350" y="23" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#93C5FD" text-anchor="middle" font-weight="500">🌐 Visor 360°</text>
      
      <!-- Badge 4: Búsqueda -->
      <rect x="435" y="0" width="140" height="36" rx="18" fill="#10B981" opacity="0.15"/>
      <rect x="435" y="0" width="140" height="36" rx="18" fill="none" stroke="#10B981" stroke-width="1" opacity="0.3"/>
      <text x="505" y="23" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#6EE7B7" text-anchor="middle" font-weight="500">🔍 Búsqueda</text>
    </g>
    
    <!-- Platform badges (right side) -->
    <g transform="translate(820, 130)">
      <!-- iOS badge -->
      <rect x="0" y="0" width="100" height="44" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="50" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="500">🍎 iOS</text>
      <text x="50" y="35" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Expo 57</text>
      
      <!-- Android badge -->
      <rect x="110" y="0" width="100" height="44" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="160" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="500">🤖 Android</text>
      <text x="160" y="35" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Expo 57</text>
      
      <!-- Supabase badge -->
      <rect x="0" y="54" width="100" height="44" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="50" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#3FCF8E" text-anchor="middle" font-weight="500">⚡ Supabase</text>
      <text x="50" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">BaaS</text>
      
      <!-- TypeScript badge -->
      <rect x="110" y="54" width="100" height="44" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="160" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#3178C6" text-anchor="middle" font-weight="500">🔷 TypeScript</text>
      <text x="160" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">6.0</text>
    </g>
    
    <!-- Bottom accent line -->
    <rect x="80" y="340" width="1040" height="3" fill="url(#accentGrad)" rx="1.5" opacity="0.6"/>
    
    <!-- Bottom text -->
    <text x="600" y="375" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#475569" text-anchor="middle" font-weight="500" letter-spacing="2">
      EQUIPO SUDOERS · APLICACIONES MÓVILES I
    </text>
    
    <!-- Decorative dots -->
    <circle cx="50" cy="50" r="4" fill="#2563EB" opacity="0.3"/>
    <circle cx="1150" cy="50" r="4" fill="#10B981" opacity="0.3"/>
    <circle cx="50" cy="350" r="4" fill="#10B981" opacity="0.3"/>
    <circle cx="1150" cy="350" r="4" fill="#2563EB" opacity="0.3"/>
  </g>
</svg>
