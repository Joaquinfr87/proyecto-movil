      <rect x="0" y="0" width="155" height="48" rx="12" fill="#1E293B" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.4"/>
      <circle cx="28" cy="24" r="14" fill="#2563EB" fill-opacity="0.15"/>
      <rect x="22" y="17" width="12" height="14" rx="6" fill="none" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="28" cy="19" r="3" fill="#2563EB"/>
      <text x="52" y="21" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#93C5FD" font-weight="600">Mapa</text>
      <text x="52" y="36" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#64748B">Interactivo</text>
      
      <!-- Favoritos -->
      <rect x="170" y="0" width="155" height="48" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>
      <circle cx="198" cy="24" r="14" fill="#10B981" fill-opacity="0.15"/>
      <polygon points="198,14 201,20 208,21 203,26 204,33 198,29 192,33 193,26 188,21 195,20" fill="#10B981"/>
