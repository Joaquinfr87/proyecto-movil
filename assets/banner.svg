<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="40%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="50%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="blueLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="greenLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1D4ED8" flood-opacity="0.4"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="500" rx="16"/></clipPath>
  </defs>
  
  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="1200" height="500" fill="url(#bg)"/>
    
    <!-- Grid -->
    <g opacity="0.05" stroke="#FFF" stroke-width="1">
      <line x1="0" y1="50" x2="1200" y2="50"/><line x1="0" y1="100" x2="1200" y2="100"/>
      <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="200" x2="1200" y2="200"/>
      <line x1="0" y1="250" x2="1200" y2="250"/><line x1="0" y1="300" x2="1200" y2="300"/>
      <line x1="0" y1="350" x2="1200" y2="350"/><line x1="0" y1="400" x2="1200" y2="400"/>
      <line x1="0" y1="450" x2="1200" y2="450"/>
      <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
      <line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
      <line x1="500" y1="0" x2="500" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
      <line x1="700" y1="0" x2="700" y2="500"/><line x1="800" y1="0" x2="800" y2="500"/>
      <line x1="900" y1="0" x2="900" y2="500"/><line x1="1000" y1="0" x2="1000" y2="500"/>
      <line x1="1100" y1="0" x2="1100" y2="500"/>
    </g>
    
    <!-- ====== GLOW SPOTS ====== -->
    <ellipse cx="600" cy="200" rx="400" ry="250" fill="url(#glowBlue)"/>
    <ellipse cx="200" cy="400" rx="300" ry="200" fill="url(#glowGreen)"/>
    <ellipse cx="1000" cy="100" rx="250" ry="180" fill="url(#glowGreen)"/>
    
    <!-- ====== DECORATIVE PINS (scattered) ====== -->
    <g opacity="0.12">
      <!-- Pin 1 - top left -->
      <g transform="translate(80, 40) scale(0.5)">
        <path d="M60 0 C35 0 14 21 14 46 C14 62 24 76 38 88 L60 116 L82 88 C96 76 106 62 106 46 C106 21 85 0 60 0Z" fill="#2563EB"/>
        <circle cx="60" cy="44" r="18" fill="#10B981"/>
      </g>
      <!-- Pin 2 - top right -->
      <g transform="translate(1060, 30) scale(0.45)">
        <path d="M60 0 C35 0 14 21 14 46 C14 62 24 76 38 88 L60 116 L82 88 C96 76 106 62 106 46 C106 21 85 0 60 0Z" fill="#10B981"/>
        <circle cx="60" cy="44" r="18" fill="#2563EB"/>
      </g>
      <!-- Pin 3 - bottom left -->
      <g transform="translate(120, 380) scale(0.4)">
        <path d="M60 0 C35 0 14 21 14 46 C14 62 24 76 38 88 L60 116 L82 88 C96 76 106 62 106 46 C106 21 85 0 60 0Z" fill="#2563EB"/>
        <circle cx="60" cy="44" r="18" fill="#10B981"/>
      </g>
      <!-- Pin 4 - bottom right -->
      <g transform="translate(1020, 400) scale(0.5)">
        <path d="M60 0 C35 0 14 21 14 46 C14 62 24 76 38 88 L60 116 L82 88 C96 76 106 62 106 46 C106 21 85 0 60 0Z" fill="#10B981"/>
        <circle cx="60" cy="44" r="18" fill="#2563EB"/>
      </g>
      <!-- Pin 5 - mid left -->
      <g transform="translate(30, 200) scale(0.35)">
        <path d="M60 0 C35 0 14 21 14 46 C14 62 24 76 38 88 L60 116 L82 88 C96 76 106 62 106 46 C106 21 85 0 60 0Z" fill="#10B981"/>
        <circle cx="60" cy="44" r="18" fill="#2563EB"/>
      </g>
      <!-- Pin 6 - far right -->
      <g transform="translate(1100, 220) scale(0.4)">
        <path d="M60 0 C35 0 14 21 14 46 C14 62 24 76 38 88 L60 116 L82 88 C96 76 106 62 106 46 C106 21 85 0 60 0Z" fill="#2563EB"/>
        <circle cx="60" cy="44" r="18" fill="#10B981"/>
      </g>
    </g>
    
    <!-- ====== GEOMETRIC SHAPES ====== -->
    <!-- Large diamond -->
    <polygon points="600,20 700,120 600,220 500,120" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.12"/>
    <polygon points="600,40 680,120 600,200 520,120" fill="none" stroke="#10B981" stroke-width="1" opacity="0.08"/>
    
    <!-- Corner triangles -->
    <polygon points="0,0 120,0 0,120" fill="#2563EB" opacity="0.06"/>
    <polygon points="1200,0 1080,0 1200,120" fill="#10B981" opacity="0.06"/>
    <polygon points="0,500 120,500 0,380" fill="#10B981" opacity="0.06"/>
    <polygon points="1200,500 1080,500 1200,380" fill="#2563EB" opacity="0.06"/>
    
    <!-- Accent lines -->
    <rect x="60" y="25" width="1080" height="2" fill="url(#accent)" rx="1" opacity="0.5"/>
    <rect x="60" y="473" width="1080" height="2" fill="url(#accent)" rx="1" opacity="0.5"/>
    
    <!-- Horizontal divider -->
    <line x1="60" y1="340" x2="1140" y2="340" stroke="#334155" stroke-width="1" opacity="0.5"/>
    
    <!-- ====== MAIN LOGO (centered, large) ====== -->
    <g transform="translate(540, 100)">
      <!-- Pulse rings -->
      <circle cx="60" cy="58" r="70" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.15"/>
      <circle cx="60" cy="58" r="90" fill="none" stroke="#10B981" stroke-width="1" opacity="0.1"/>
      <circle cx="60" cy="58" r="110" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.06"/>
      
      <!-- Pin -->
      <path d="M60 0 C35 0 14 21 14 46 C14 62 24 76 38 88 L60 116 L82 88 C96 76 106 62 106 46 C106 21 85 0 60 0Z" 
            fill="url(#blue)" filter="url(#shadow)"/>
      <!-- Inner circle -->
      <circle cx="60" cy="44" r="22" fill="url(#green)"/>
      <!-- Field lines -->
      <circle cx="60" cy="44" r="8" fill="none" stroke="#FFF" stroke-width="1.5" opacity="0.9"/>
      <circle cx="60" cy="44" r="2" fill="#FFF" opacity="0.9"/>
      <line x1="60" y1="22" x2="60" y2="66" stroke="#FFF" stroke-width="1" opacity="0.6"/>
      <rect x="42" y="26" width="36" height="36" rx="1" fill="none" stroke="#FFF" stroke-width="1" opacity="0.6"/>
    </g>
    
