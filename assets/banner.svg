    <circle cx="1160" cy="40" r="5" fill="#10B981" opacity="0.3"/>
    <circle cx="40" cy="460" r="5" fill="#10B981" opacity="0.3"/>
    <circle cx="1160" cy="460" r="5" fill="#2563EB" opacity="0.3"/>
    
