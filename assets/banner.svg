<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1200" height="500" rx="16"/>
    </clipPath>
  </defs>
  
  <g clip-path="url(#bannerClip)">
    <!-- Background -->
    <rect width="1200" height="500" fill="url(#bgGrad)" rx="16"/>
    
    <!-- Decorative grid pattern -->
    <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
      <line x1="0" y1="60" x2="1200" y2="60"/>
      <line x1="0" y1="120" x2="1200" y2="120"/>
      <line x1="0" y1="180" x2="1200" y2="180"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="0" y1="300" x2="1200" y2="300"/>
      <line x1="0" y1="360" x2="1200" y2="360"/>
      <line x1="0" y1="420" x2="1200" y2="420"/>
      <line x1="0" y1="480" x2="1200" y2="480"/>
      <line x1="120" y1="0" x2="120" y2="500"/>
      <line x1="240" y1="0" x2="240" y2="500"/>
      <line x1="360" y1="0" x2="360" y2="500"/>
      <line x1="480" y1="0" x2="480" y2="500"/>
      <line x1="600" y1="0" x2="600" y2="500"/>
      <line x1="720" y1="0" x2="720" y2="500"/>
      <line x1="840" y1="0" x2="840" y2="500"/>
      <line x1="960" y1="0" x2="960" y2="500"/>
      <line x1="1080" y1="0" x2="1080" y2="500"/>
    </g>
    
    <!-- Decorative map pins (background, very subtle) -->
    <g opacity="0.06">
      <path d="M180 100 C168 100 158 110 158 122 C158 130 163 137 169 142 L180 155 L191 142 C197 137 202 130 202 122 C202 110 192 100 180 100Z" fill="#2563EB"/>
      <path d="M1020 70 C1008 70 998 80 998 92 C998 100 1003 107 1009 112 L1020 125 L1031 112 C1037 107 1042 100 1042 92 C1042 80 1032 70 1020 70Z" fill="#10B981"/>
      <path d="M880 420 C868 420 858 430 858 442 C858 450 863 457 869 462 L880 475 L891 462 C897 457 902 450 902 442 C902 430 892 420 880 420Z" fill="#2563EB"/>
      <path d="M280 440 C268 440 258 450 258 462 C258 470 263 477 269 482 L280 495 L291 482 C297 477 302 470 302 462 C302 450 292 440 280 440Z" fill="#10B981"/>
    </g>
    
    <!-- Accent line top -->
    <rect x="80" y="50" width="1040" height="3" fill="url(#accentGrad)" rx="1.5" opacity="0.5"/>
    
    <!-- ====== LEFT SECTION: Logo + Title + Subtitle ====== -->
    
    <!-- Logo mark -->
    <g transform="translate(100, 100)">
      <!-- Pin -->
      <path d="M60 0 C35 0 14 21 14 46 C14 62 24 76 38 88 L60 116 L82 88 C96 76 106 62 106 46 C106 21 85 0 60 0Z" 
            fill="url(#blueGrad)" filter="url(#glow)"/>
      <!-- Inner circle -->
      <circle cx="60" cy="44" r="22" fill="url(#greenGrad)"/>
      <!-- Field lines -->
      <circle cx="60" cy="44" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
      <circle cx="60" cy="44" r="2" fill="#FFFFFF" opacity="0.9"/>
      <line x1="60" y1="22" x2="60" y2="66" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
      <rect x="42" y="26" width="36" height="36" rx="1" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    </g>
    
    <!-- Title -->
    <text x="250" y="155" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Lugares</text>
    <text x="515" y="155" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" fill="#10B981" letter-spacing="-1">Interactivos</text>
    
    <!-- Subtitle -->
    <text x="250" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94A3B8" font-weight="400" letter-spacing="4">VISUALIZACIÓN INTERACTIVA DE ESCENARIOS DEPORTIVOS</text>
    
    <!-- ====== FEATURE BADGES (centered row) ====== -->
    <g transform="translate(250, 250)">
      <!-- Badge 1: Mapa -->
      <rect x="0" y="0" width="130" height="40" rx="20" fill="#2563EB" opacity="0.12"/>
      <rect x="0" y="0" width="130" height="40" rx="20" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>
      <text x="65" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#93C5FD" text-anchor="middle" font-weight="500">📍 Mapa</text>
      
      <!-- Badge 2: Favoritos -->
      <rect x="145" y="0" width="140" height="40" rx="20" fill="#10B981" opacity="0.12"/>
      <rect x="145" y="0" width="140" height="40" rx="20" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.3"/>
      <text x="215" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#6EE7B7" text-anchor="middle" font-weight="500">⭐ Favoritos</text>
      
      <!-- Badge 3: Visor 360° -->
      <rect x="300" y="0" width="150" height="40" rx="20" fill="#2563EB" opacity="0.12"/>
      <rect x="300" y="0" width="150" height="40" rx="20" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>
      <text x="375" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#93C5FD" text-anchor="middle" font-weight="500">🌐 Visor 360°</text>
      
      <!-- Badge 4: Búsqueda -->
      <rect x="465" y="0" width="150" height="40" rx="20" fill="#10B981" opacity="0.12"/>
      <rect x="465" y="0" width="150" height="40" rx="20" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.3"/>
      <text x="540" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#6EE7B7" text-anchor="middle" font-weight="500">🔍 Búsqueda</text>
    </g>
    
    <!-- ====== PLATFORM BADGES (right side, stacked) ====== -->
    <g transform="translate(870, 110)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="120" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="60" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" font-weight="600">🍎 iOS</text>
      <text x="60" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Expo 57</text>
      
      <rect x="130" y="0" width="120" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="190" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" font-weight="600">🤖 Android</text>
      <text x="190" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Expo 57</text>
      
      <!-- Row 2 -->
      <rect x="0" y="58" width="120" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="60" y="79" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#3FCF8E" text-anchor="middle" font-weight="600">⚡ Supabase</text>
      <text x="60" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">BaaS</text>
      
      <rect x="130" y="58" width="120" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="190" y="79" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#3178C6" text-anchor="middle" font-weight="600">🔷 TypeScript</text>
      <text x="190" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">6.0</text>
    </g>
    
    <!-- ====== ARCHITECTURE DIAGRAM (bottom section) ====== -->
    <g transform="translate(80, 330)">
      <!-- Frontend box -->
      <rect x="0" y="0" width="340" height="90" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="170" y="25" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#93C5FD" text-anchor="middle" font-weight="600">FRONTEND</text>
      <text x="170" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">React Native + Expo Router</text>
      <text x="170" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">MapLibre · Reanimated · TanStack Query</text>
      <text x="170" y="79" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">React Hook Form + Zod</text>
      
      <!-- Arrow -->
      <text x="420" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#334155" text-anchor="middle">→</text>
      
      <!-- Backend box -->
      <rect x="480" y="0" width="340" height="90" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="650" y="25" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#3FCF8E" text-anchor="middle" font-weight="600">BACKEND</text>
      <text x="650" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Supabase (Local / Cloud)</text>
      <text x="650" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Auth · PostgreSQL · Storage</text>
      <text x="650" y="79" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Realtime · Edge Functions</text>
    </g>
    
    <!-- Bottom accent line -->
    <rect x="80" y="445" width="1040" height="3" fill="url(#accentGrad)" rx="1.5" opacity="0.5"/>
    
    <!-- Bottom text -->
    <text x="600" y="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="500" letter-spacing="2">EQUIPO SUDOERS · APLICACIONES MÓVILES I</text>
    
    <!-- Decorative dots -->
    <circle cx="50" cy="50" r="4" fill="#2563EB" opacity="0.25"/>
    <circle cx="1150" cy="50" r="4" fill="#10B981" opacity="0.25"/>
    <circle cx="50" cy="450" r="4" fill="#10B981" opacity="0.25"/>
    <circle cx="1150" cy="450" r="4" fill="#2563EB" opacity="0.25"/>
  </g>
</svg>
