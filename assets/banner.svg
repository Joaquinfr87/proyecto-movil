      <circle cx="368" cy="24" r="14" fill="#2563EB" fill-opacity="0.15"/>
      <circle cx="368" cy="24" r="8" fill="none" stroke="#2563EB" stroke-width="1.5"/>
      <ellipse cx="368" cy="24" rx="4" ry="8" fill="none" stroke="#2563EB" stroke-width="1"/>
      <text x="392" y="21" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#93C5FD" font-weight="600">Visor 360</text>
      <text x="392" y="36" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#64748B">Panoramico</text>
      
      <!-- Busqueda -->
      <rect x="510" y="0" width="155" height="48" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>
      <circle cx="538" cy="24" r="14" fill="#10B981" fill-opacity="0.15"/>
      <circle cx="535" cy="22" r="6" fill="none" stroke="#10B981" stroke-width="1.5"/>
      <line x1="539" y1="26" x2="544" y2="31" stroke="#10B981" stroke-width="1.5"/>
      <text x="562" y="21" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6EE7B7" font-weight="600">Busqueda</text>
      <text x="562" y="36" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#64748B">Filtrar</text>
    </g>
    
    <!-- ====== PLATFORM CHIPS (bottom section, right) ====== -->
    <g transform="translate(740, 370)">
      <!-- iOS -->
      <rect x="0" y="0" width="110" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="55" y="21" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle" font-weight="600">iOS</text>
      <text x="55" y="36" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Expo 57</text>
      
      <!-- Android -->
      <rect x="120" y="0" width="110" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="175" y="21" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle" font-weight="600">Android</text>
      <text x="175" y="36" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Expo 57</text>
      
      <!-- Supabase -->
      <rect x="240" y="0" width="110" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="295" y="21" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#3FCF8E" text-anchor="middle" font-weight="600">Supabase</text>
      <text x="295" y="36" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#475569" text-anchor="middle">BaaS</text>
      
      <!-- TypeScript -->
