      <text x="415" y="21" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#3178C6" text-anchor="middle" font-weight="600">TypeScript</text>
      <text x="415" y="36" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#475569" text-anchor="middle">6.0</text>
    </g>
    
