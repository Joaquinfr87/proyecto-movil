      <circle cx="900" cy="90" r="3" fill="#10B981"/><circle cx="930" cy="90" r="3" fill="#10B981"/>
      <circle cx="960" cy="90" r="3" fill="#10B981"/><circle cx="990" cy="90" r="3" fill="#10B981"/>
      
      <circle cx="780" cy="120" r="3" fill="#2563EB"/><circle cx="810" cy="120" r="3" fill="#2563EB"/>
      <circle cx="840" cy="120" r="3" fill="#2563EB"/><circle cx="870" cy="120" r="3" fill="#2563EB"/>
      <circle cx="900" cy="120" r="3" fill="#2563EB"/><circle cx="930" cy="120" r="3" fill="#2563EB"/>
      <circle cx="960" cy="120" r="3" fill="#2563EB"/><circle cx="990" cy="120" r="3" fill="#2563EB"/>
      
      <circle cx="780" cy="150" r="3" fill="#10B981"/><circle cx="810" cy="150" r="3" fill="#10B981"/>
      <circle cx="840" cy="150" r="3" fill="#10B981"/><circle cx="870" cy="150" r="3" fill="#10B981"/>
      <circle cx="900" cy="150" r="3" fill="#10B981"/><circle cx="930" cy="150" r="3" fill="#10B981"/>
      <circle cx="960" cy="150" r="3" fill="#10B981"/><circle cx="990" cy="150" r="3" fill="#10B981"/>
      
      <circle cx="780" cy="180" r="3" fill="#2563EB"/><circle cx="810" cy="180" r="3" fill="#2563EB"/>
      <circle cx="840" cy="180" r="3" fill="#2563EB"/><circle cx="870" cy="180" r="3" fill="#2563EB"/>
      <circle cx="900" cy="180" r="3" fill="#2563EB"/><circle cx="930" cy="180" r="3" fill="#2563EB"/>
      <circle cx="960" cy="180" r="3" fill="#2563EB"/><circle cx="990" cy="180" r="3" fill="#2563EB"/>
      
      <circle cx="780" cy="210" r="3" fill="#10B981"/><circle cx="810" cy="210" r="3" fill="#10B981"/>
      <circle cx="840" cy="210" r="3" fill="#10B981"/><circle cx="870" cy="210" r="3" fill="#10B981"/>
      <circle cx="900" cy="210" r="3" fill="#10B981"/><circle cx="930" cy="210" r="3" fill="#10B981"/>
      <circle cx="960" cy="210" r="3" fill="#10B981"/><circle cx="990" cy="210" r="3" fill="#10B981"/>
      
      <circle cx="780" cy="240" r="3" fill="#2563EB"/><circle cx="810" cy="240" r="3" fill="#2563EB"/>
      <circle cx="840" cy="240" r="3" fill="#2563EB"/><circle cx="870" cy="240" r="3" fill="#2563EB"/>
      <circle cx="900" cy="240" r="3" fill="#2563EB"/><circle cx="930" cy="240" r="3" fill="#2563EB"/>
      <circle cx="960" cy="240" r="3" fill="#2563EB"/><circle cx="990" cy="240" r="3" fill="#2563EB"/>
      
      <circle cx="780" cy="270" r="3" fill="#10B981"/><circle cx="810" cy="270" r="3" fill="#10B981"/>
      <circle cx="840" cy="270" r="3" fill="#10B981"/><circle cx="870" cy="270" r="3" fill="#10B981"/>
      <circle cx="900" cy="270" r="3" fill="#10B981"/><circle cx="930" cy="270" r="3" fill="#10B981"/>
      <circle cx="960" cy="270" r="3" fill="#10B981"/><circle cx="990" cy="270" r="3" fill="#10B981"/>
      
      <circle cx="780" cy="300" r="3" fill="#2563EB"/><circle cx="810" cy="300" r="3" fill="#2563EB"/>
      <circle cx="840" cy="300" r="3" fill="#2563EB"/><circle cx="870" cy="300" r="3" fill="#2563EB"/>
      <circle cx="900" cy="300" r="3" fill="#2563EB"/><circle cx="930" cy="300" r="3" fill="#2563EB"/>
      <circle cx="960" cy="300" r="3" fill="#2563EB"/><circle cx="990" cy="300" r="3" fill="#2563EB"/>
      
      <circle cx="780" cy="330" r="3" fill="#10B981"/><circle cx="810" cy="330" r="3" fill="#10B981"/>
