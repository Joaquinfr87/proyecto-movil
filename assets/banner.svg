<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="50%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="50%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1D4ED8" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="400" rx="16"/></clipPath>
  </defs>
  
  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="1200" height="400" fill="url(#bg)"/>
    
    <!-- Grid -->
    <g opacity="0.04" stroke="#FFF" stroke-width="1">
      <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/>
      <line x1="200" y1="0" x2="200" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
      <line x1="600" y1="0" x2="600" y2="400"/><line x1="800" y1="0" x2="800" y2="400"/>
      <line x1="1000" y1="0" x2="1000" y2="400"/>
    </g>
    
    <!-- Subtle pins -->
    <g opacity="0.05">
      <path d="M150 80 C140 80 132 88 132 98 C132 105 136 111 141 115 L150 126 L159 115 C164 111 168 105 168 98 C168 88 160 80 150 80Z" fill="#2563EB"/>
      <path d="M1050 60 C1040 60 1032 68 1032 78 C1032 85 1036 91 1041 95 L1050 106 L1059 95 C1064 91 1068 85 1068 78 C1068 68 1060 60 1050 60Z" fill="#10B981"/>
      <path d="M900 340 C890 340 882 348 882 358 C882 365 886 371 891 375 L900 386 L909 375 C914 371 918 365 918 358 C918 348 910 340 900 340Z" fill="#2563EB"/>
      <path d="M250 330 C240 330 232 338 232 348 C232 355 236 361 241 365 L250 376 L259 365 C264 361 268 355 268 348 C268 338 260 330 250 330Z" fill="#10B981"/>
    </g>
    
    <!-- Accent lines -->
    <rect x="80" y="30" width="1040" height="3" fill="url(#accent)" rx="1.5" opacity="0.4"/>
    <rect x="80" y="367" width="1040" height="3" fill="url(#accent)" rx="1.5" opacity="0.4"/>
    
    <!-- ====== MAIN LOGO (centered) ====== -->
    <g transform="translate(540, 60)">
      <path d="M60 0 C35 0 14 21 14 46 C14 62 24 76 38 88 L60 116 L82 88 C96 76 106 62 106 46 C106 21 85 0 60 0Z" 
            fill="url(#blue)" filter="url(#shadow)"/>
      <circle cx="60" cy="44" r="22" fill="url(#green)"/>
      <circle cx="60" cy="44" r="8" fill="none" stroke="#FFF" stroke-width="1.5" opacity="0.9"/>
      <circle cx="60" cy="44" r="2" fill="#FFF" opacity="0.9"/>
      <line x1="60" y1="22" x2="60" y2="66" stroke="#FFF" stroke-width="1" opacity="0.6"/>
      <rect x="42" y="26" width="36" height="36" rx="1" fill="none" stroke="#FFF" stroke-width="1" opacity="0.6"/>
    </g>
    
    <!-- Arcs -->
    <circle cx="600" cy="130" r="80" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.1"/>
    <circle cx="600" cy="130" r="110" fill="none" stroke="#10B981" stroke-width="1" opacity="0.08"/>
    <circle cx="600" cy="130" r="140" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.05"/>
    
    <!-- Feature pills -->
    <g transform="translate(150, 230)">
      <rect x="0" y="0" width="140" height="42" rx="21" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.3"/>
      <text x="70" y="27" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#93C5FD" text-anchor="middle" font-weight="500">Mapa</text>
      
      <rect x="160" y="0" width="140" height="42" rx="21" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3"/>
      <text x="230" y="27" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#6EE7B7" text-anchor="middle" font-weight="500">Favoritos</text>
      
      <rect x="320" y="0" width="160" height="42" rx="21" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.3"/>
      <text x="400" y="27" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#93C5FD" text-anchor="middle" font-weight="500">Visor 360</text>
      
      <rect x="500" y="0" width="140" height="42" rx="21" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3"/>
      <text x="570" y="27" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#6EE7B7" text-anchor="middle" font-weight="500">Busqueda</text>
    </g>
    
    <!-- Platform chips -->
    <g transform="translate(980, 200)">
      <rect x="0" y="0" width="140" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="70" y="21" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" font-weight="500">iOS + Android</text>
      
      <rect x="0" y="40" width="140" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="70" y="61" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#3FCF8E" text-anchor="middle" font-weight="500">Supabase</text>
      
      <rect x="0" y="80" width="140" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="70" y="101" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#3178C6" text-anchor="middle" font-weight="500">TypeScript</text>
    </g>
    
    <!-- Dots -->
    <circle cx="50" cy="50" r="4" fill="#2563EB" opacity="0.25"/>
    <circle cx="1150" cy="50" r="4" fill="#10B981" opacity="0.25"/>
    <circle cx="50" cy="350" r="4" fill="#10B981" opacity="0.25"/>
    <circle cx="1150" cy="350" r="4" fill="#2563EB" opacity="0.25"/>
  </g>
</svg>
